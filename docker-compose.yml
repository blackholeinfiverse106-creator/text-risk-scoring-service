# ============================================================
# BHIV Enforcement Gateway — Local Development Compose
# ============================================================

services:
  enforcement-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhiv-enforcement-gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
